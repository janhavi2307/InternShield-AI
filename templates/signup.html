<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | InternShield AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <main class="auth-section">
        <div class="auth-card">
            <a href="{{ url_for('home') }}" class="brand-link">
                InternShield <span>AI</span>
            </a>

            <h1>Create your account</h1>

            <p class="auth-subtitle">
                Start evaluating internship opportunities confidently.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label" for="full_name">
                        Full name
                    </label>

                    <input
                        class="form-control"
                        id="full_name"
                        name="full_name"
                        type="text"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">
                        Email address
                    </label>

                    <input
                        class="form-control"
                        id="email"
                        name="email"
                        type="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">
                        Password
                    </label>

                    <input
                        class="form-control"
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label class="form-label" for="confirm_password">
                        Confirm password
                    </label>

                    <input
                        class="form-control"
                        id="confirm_password"
                        name="confirm_password"
                        type="password"
                        minlength="8"
                        required
                    >
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Create account
                </button>
            </form>
        </div>
    </main>
</body>
</html>
